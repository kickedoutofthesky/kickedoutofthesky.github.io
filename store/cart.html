<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopping Cart - Kicked Out of the Sky</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
    <link rel="stylesheet" href="../css/ui.css" />
    <link rel="stylesheet" href="assets/css/styles.css" />
    <style>
      #cart-items {
        display: grid;
        gap: 20px;
        margin-bottom: 40px;
      }

      #cart-summary {
        width: 100%;
        margin-top: 0;
      }

      @media (max-width: 576px) {
        #cart-items > div {
          flex-wrap: wrap;
        }

        #cart-items > div > div:first-child {
          width: 100%;
          margin-bottom: 15px;
        }

        #cart-items > div > div:last-child {
          width: 100%;
        }
      }

      @media (max-width: 767px) {
        div[style*="margin-top: 100px"] {
          margin-top: 180px !important;
        }

        div[style*="margin-top: 100px"] .container {
          max-width: 100%;
          padding: 0;
        }

        .cart-container {
          display: block;
        }

        #cart-items {
          display: grid;
          gap: 20px;
          margin-bottom: 40px;
          width: 100%;
          padding: 0 20px;
        }

        #cart-summary {
          width: calc(100% - 40px);
          margin-top: 40px;
          margin-left: 20px;
          margin-right: 20px;
        }
        div[style*="margin-top: 100px"] {
          margin-top: 140px !important;
        }

        div[style*="margin-top: 100px"] .container {
          max-width: 100%;
          padding: 0;
        }

        .cart-container {
          display: block;
        }

        #cart-items {
          display: grid;
          gap: 20px;
          margin-bottom: 40px;
          width: 100%;
          padding: 0 20px;
        }

        #cart-summary {
          width: calc(100% - 40px);
          position: static;
          margin-top: 40px;
          margin-left: 20px;
          margin-right: 20px;
        }
      }

      @media (min-width: 1000px) {
        .cart-container {
          display: flex;
          gap: 40px;
          align-items: flex-start;
        }

        #cart-items {
          flex: 1;
          display: grid;
          gap: 20px;
          margin-bottom: 0;
          height: fit-content;
        }

        #cart-items > div {
          padding: 15px !important;
        }

        #cart-summary {
          height: fit-content;
          position: sticky;
          top: 165px;
          margin-top: 0 !important;
        }
      }

      @media (min-width: 1000px) and (max-width: 1199px) {
        #cart-summary {
          width: 350px;
        }
      }

      @media (min-width: 1200px) {
        #cart-summary {
          width: 400px;
        }
      }
    </style>
    <script src="js/api-config.js"></script>
  </head>
  <body data-bs-spy="scroll" data-bs-offset="0" class="text-center" tabindex="0">
    <!-- Navbar -->
    <nav
      id="navbarMain"
      class="navbar navbar-expand site-header fixed-top"
      style="padding: 15px 40px 15px 0; background-color: #00000080"
    >
      <div class="container-fluid" style="display: flex; justify-content: space-between; align-items: center">
        <a href="../index.html" style="flex-shrink: 0; display: flex; align-items: center">
          <img
            class="brand"
            src="../img/Kicked-Out-Of-The-Sky_transparent.png"
            alt="Kicked Out of the Sky Logo"
            style="width: auto; display: block"
          />
        </a>
        <ul class="nav" style="gap: 30px; display: flex; flex-wrap: nowrap; margin: 0; list-style: none">
          <li class="nav-item">
            <a
              class="nav-link"
              href="index.html"
              style="
                color: #999;
                text-decoration: none;
                font-size: 1.2rem;
                display: flex;
                align-items: center;
                transition: ease-in-out color 0.15s;
                cursor: pointer;
              "
              onmouseover="this.style.color = '#fff'"
              onmouseout="this.style.color = '#999'"
            >
              Merch
            </a>
          </li>
          <li class="nav-item" style="position: relative">
            <a
              class="nav-link"
              href="cart.html"
              style="
                color: #999;
                text-decoration: none;
                font-size: 1.2rem;
                display: flex;
                align-items: center;
                gap: 8px;
                transition: ease-in-out color 0.15s;
                cursor: pointer;
              "
              onmouseover="this.style.color = '#fff'"
              onmouseout="this.style.color = '#999'"
            >
              <i class="fas fa-shopping-cart"></i>
              Cart
              <span
                id="cart-badge"
                class="badge"
                style="
                  background-color: #ffc107;
                  color: #000;
                  position: absolute;
                  top: -5px;
                  right: -10px;
                  display: none;
                  font-size: 0.7rem;
                  width: 20px;
                  height: 20px;
                  border-radius: 50%;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  padding: 0;
                "
              >
                0
              </span>
            </a>
          </li>
        </ul>
      </div>
    </nav>

    <div style="margin-top: 100px">
      <div class="container" data-testid="cart-page">
        <h1 style="color: #fff; margin-bottom: 40px">Shopping Cart</h1>

        <!-- Empty Cart Message -->
        <div id="empty-cart" data-testid="empty-cart-message" style="text-align: center; padding: 40px">
          <p style="color: #ccc">Your cart is empty</p>
          <a href="index.html" class="btn btn-primary">Continue Shopping</a>
        </div>

        <!-- Cart Container -->
        <div class="cart-container">
          <!-- Cart Items -->
          <div id="cart-items" data-testid="cart-page" style="display: grid; gap: 20px; margin-bottom: 40px">
            <!-- Cart items will be rendered here -->
          </div>

          <!-- Order Summary -->
          <div
            id="cart-summary"
            style="
              display: none;
              background: #0f0f0f;
              padding: 30px;
              border-radius: 8px;
              border: 1px solid #1a1a1a;
              margin-top: 40px;
            "
          >
            <h3 style="color: #fff; margin-bottom: 20px">Order Summary</h3>
            <div
              style="
                display: flex;
                justify-content: space-between;
                color: #ccc;
                margin-bottom: 15px;
                padding-bottom: 15px;
                border-bottom: 1px solid #333;
              "
            >
              <span>Subtotal:</span>
              <span id="subtotal" data-testid="cart-subtotal">$0.00</span>
            </div>
            <div
              style="
                display: flex;
                justify-content: space-between;
                color: #ccc;
                margin-bottom: 15px;
                padding-bottom: 15px;
                border-bottom: 1px solid #333;
              "
            >
              <span>Tax:</span>
              <span>TBD</span>
            </div>
            <div
              style="
                display: flex;
                justify-content: space-between;
                color: #ccc;
                margin-bottom: 15px;
                padding-bottom: 15px;
                border-bottom: 1px solid #333;
              "
            >
              <span>Shipping:</span>
              <span>TBD</span>
            </div>
            <div
              style="display: flex; justify-content: space-between; color: #fff; font-size: 1.2rem; font-weight: bold"
            >
              <span>Total:</span>
              <span id="total">$0.00</span>
            </div>
            <p style="color: #999; font-size: 0.9rem; margin-top: 15px; padding-top: 15px; border-top: 1px solid #333">
              Shipping address and taxes will be calculated during checkout.
            </p>
            <div style="margin-top: 20px">
              <label for="shipping-country" style="color: #ccc; display: block; margin-bottom: 8px; text-align: left">
                Shipping Country
                <span style="color: #ff6b6b">*</span>
              </label>
              <select
                id="shipping-country"
                data-testid="shipping-country-select"
                style="
                  width: 100%;
                  padding: 12px;
                  background-color: #1a1a1a;
                  color: #ccc;
                  border: 1px solid #333;
                  border-radius: 4px;
                  font-size: 1rem;
                "
              >
                <option value="">Select a country...</option>
              </select>
            </div>
            <button
              id="checkout-btn"
              class="btn btn-warning w-100"
              style="margin-top: 20px; font-weight: bold; padding: 15px"
              disabled
            >
              Proceed to Checkout
            </button>
            <button class="btn btn-outline-secondary w-100" style="margin-top: 10px; padding: 15px">
              <a href="index.html" style="text-decoration: none; color: inherit">Continue Shopping</a>
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/cart-notification.js"></script>
    <script src="js/cart-display.js"></script>
  </body>
</html>
