    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/cart.js"></script>

    <script>
      // Store country code to name mapping
      let countryNameMap = {};
      // Store products data
      let productsData = [];

      // Load countries data and build mapping
      async function loadCountries() {
        try {
          const response = await fetch("./data/printful-shipping-countries.json");
          if (!response.ok) throw new Error("Failed to load countries");
          const countries = await response.json();
          countryNameMap = {};
          countries.forEach(country => {
            countryNameMap[country.code] = country.name;
          });
        } catch (error) {
          console.error("Error loading countries:", error);
        }
      }

      // Get country name from code
      function getCountryName(code) {
        return countryNameMap[code] || code;
      }

      // Load products data
      async function loadProducts() {
        try {
          const response = await fetch("./data/products.json");
          if (!response.ok) throw new Error("Failed to load products");
          productsData = await response.json();
        } catch (error) {
          console.error("Error loading products:", error);
        }
      }

      // Parse item name format: "Product Title - Color / Size"
      function parseItemName(itemName) {
        // Example: "Unisex Tee w/ Man Falling - Black / S"
        const parts = itemName.split(" - ");
        if (parts.length < 2) {
          return { productTitle: itemName, color: null, size: null };
        }

        const productTitle = parts[0];
        const colorSizePart = parts.slice(1).join(" - "); // Handle cases with " - " in color name
        const colorSizeSplit = colorSizePart.split(" / ");
        const color = colorSizeSplit[0];
        const size = colorSizeSplit[1] || null;

        return { productTitle, color, size };
      }

      // Get product image URL
      function getProductImage(product, color) {
        if (!product) return null;
        // Use color-specific image if available
        if (color && product.variants && product.variants[color] && product.variants[color].image) {
          return product.variants[color].image;
        }
        // Fallback to product image
        return product.image || null;
      }

      // Find product by title
      function findProductByTitle(title) {
        return productsData.find(p => p.title === title);
      }

      // Show/hide loading indicator
      function showLoadingIndicator() {
        const loadingEl = document.getElementById("loading-indicator");
        if (loadingEl) {
          loadingEl.style.display = "block";
        }
      }

      function hideLoadingIndicator() {
        const loadingEl = document.getElementById("loading-indicator");
        if (loadingEl) {
          loadingEl.style.display = "none";
        }
      }

      // Retrieve order details from Stripe session (appended by Stripe redirect)
      document.addEventListener("DOMContentLoaded", async () => {
        // Load countries and products first
        await loadCountries();
        await loadProducts();

        // Extract session_id from URL params (Stripe appends ?session_id=cs_test_...)
        const params = new URLSearchParams(window.location.search);
        const sessionId = params.get("session_id");

        if (!sessionId) {
          // No session ID provided — customer navigated here directly or session expired
          showGenericThanks();
          return;
        }

        // Order reference will be displayed in order-id-display when we have data

        // Fetch order details from backend
        showLoadingIndicator();
        try {
          const backendUrl = window.__API_URL__ || "https://kickedoutofthesky-store.vercel.app";

          const response = await fetch(`${backendUrl}/api/order-details?session_id=${encodeURIComponent(sessionId)}`);

          if (!response.ok) {
            hideLoadingIndicator();
            if (response.status === 404) {
              // Session not found or not paid
              console.error("Order not found or payment incomplete");
              showOrderNotFoundError();
              return;
            } else if (response.status === 401) {
              // Unauthorized (session doesn't belong to this store)
              console.error("Unauthorized access to session");
              showGenericThanks();
              return;
            } else {
              throw new Error(`API error: ${response.status}`);
            }
          }

          const data = await response.json();

          // orderId logged but not displayed on page per user request

          // Validate response contains expected data
          // Display if we have any order data (items, summary, shipping, etc)

          if (data.lineItems || data.orderSummary || data.shippingDetails || data.shippingAddress) {
            displayOrderDetails(data);
            hideLoadingIndicator();
            // Clear cart and saved country now that payment is confirmed
            if (typeof cart !== "undefined" && cart && typeof cart.clear === "function") {
              cart.clear();
            }
            localStorage.removeItem("selectedShippingCountry");
          } else {
            // Fallback if no meaningful data returned
            hideLoadingIndicator();
            showGenericThanks();
          }
        } catch (error) {
          hideLoadingIndicator();
          console.error("Error fetching order details:", error);
          // API failed, but order was placed — show reassuring message
          showApiErrorMessage();
        }
      });

      function displayOrderDetails(data) {
        // Map API response fields (may vary based on backend implementation)
        const customer = data.customer || data.customerDetails || {};
        let shippingAddress = data.shippingAddress;
        if (!shippingAddress && data.shippingDetails?.address) {
          shippingAddress = {
            name: data.shippingDetails.name,
            line1: data.shippingDetails.address.line1,
            line2: data.shippingDetails.address.line2,
            city: data.shippingDetails.address.city,
            state: data.shippingDetails.address.state,
            postal_code: data.shippingDetails.address.postal_code,
            country: data.shippingDetails.address.country,
          };
        }
        shippingAddress = shippingAddress || {};

        const shippingMethod = data.shippingMethod || data.shippingOption;
        const orderSummary = data.orderSummary || {};
        let lineItems = data.lineItems || [];

        // Map line items if they use 'description' and 'amount_total' instead of 'name' and 'amount'
        lineItems = lineItems.map(item => ({
          name: item.name || item.description || "Item",
          quantity: item.quantity || 1,
          unitPrice: item.unitPrice !== undefined ? item.unitPrice : item.unit_price,
          amount: item.amount !== undefined ? item.amount : item.amount_total,
        }));

        const currency = data.currency || "USD";
        const currencySymbol = currency === "USD" ? "$" : currency;

        // Display customer info
        if (customer.email || customer.name || customer.phone) {
          if (customer.name) {
            document.getElementById("customer-name").textContent = customer.name;
          }
          if (customer.email) {
            document.getElementById("customer-email").textContent = customer.email;
          }
          if (customer.phone) {
            document.getElementById("customer-phone").textContent = customer.phone;
          }
          const customerSection = document.getElementById("customer-section");
          if (customerSection) {
            customerSection.style.display = "block";
          }
        }

        // Display shipping address
        if (shippingAddress.line1 || shippingAddress.city || shippingAddress.country) {
          const addressDiv = document.getElementById("shipping-address");
          if (addressDiv) {
            const parts = [];

            if (shippingAddress.name) parts.push(`<strong>${shippingAddress.name}</strong>`);
            if (shippingAddress.line1) parts.push(shippingAddress.line1);
            if (shippingAddress.line2) parts.push(shippingAddress.line2);

            const cityStateZip = [shippingAddress.city, shippingAddress.state, shippingAddress.postal_code]
              .filter(Boolean)
              .join(" ");
            if (cityStateZip) parts.push(cityStateZip);

            if (shippingAddress.country) parts.push(getCountryName(shippingAddress.country));

            addressDiv.innerHTML = parts.join("<br>");
            const shippingSection = document.getElementById("shipping-section");
            if (shippingSection) {
              shippingSection.style.display = "block";
            }
          }
        }

        // Display shipping method if available
        if (shippingMethod) {
          const methodSection = document.getElementById("shipping-method-section");
          if (methodSection) {
            document.getElementById("shipping-method").textContent = shippingMethod;
            methodSection.style.display = "block";
          }
          const shippingSection = document.getElementById("shipping-section");
          if (shippingSection) {
            shippingSection.style.display = "block";
          }
        }

        // Display order items with unit prices and line totals
        if (lineItems.length > 0) {
          const itemsDiv = document.getElementById("order-items");
          if (itemsDiv) {
            itemsDiv.innerHTML = lineItems
              .map(item => {
                const unitPrice = (item.unitPrice || 0) / 100;
                const lineTotal = (item.amount || 0) / 100;

                // Parse item name to get product info
                const { productTitle, color, size } = parseItemName(item.name);
                const product = findProductByTitle(productTitle);
                const imageUrl = product ? getProductImage(product, color) : null;
                const itemIsSticker = product && product.title.toLowerCase().includes("sticker");

                // Build item HTML with image
                let itemHtml = `<div style="margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid #333; display: flex; gap: 16px; flex-wrap: wrap;">`;

                // Add product image if available
                if (imageUrl) {
                  itemHtml += `<div style="flex-shrink: 0; width: 80px; height: 80px; overflow: hidden; border-radius: 4px;">
                    <img loading="lazy" src="${imageUrl}" alt="${item.name}" style="width: 100%; height: 100%; object-fit: cover;${itemIsSticker ? " transform: scale(1.75);" : ""}">
                  </div>`;
                }

                // Add item details
                itemHtml += `<div style="flex: 1;">
                  <div style="display: flex; justify-content: space-between; gap: 10px; margin-bottom: 6px">
                    <div>${item.name || "Item"}</div>
                    <div style="font-weight: bold; white-space: nowrap">${currencySymbol}${lineTotal.toFixed(2)}</div>
                  </div>
                  <div style="display: flex; justify-content: space-between; color: #999; font-size: 0.85rem">
                    <div>Qty: ${item.quantity || 1} × ${currencySymbol}${unitPrice.toFixed(2)} each</div>
                  </div>
                </div>
              </div>`;

                return itemHtml;
              })
              .join("");
          }
        }

        // Display cost breakdown
        if (
          orderSummary.subtotal !== undefined ||
          orderSummary.shipping !== undefined ||
          orderSummary.tax !== undefined ||
          orderSummary.total !== undefined
        ) {
          const summarySubtotal = document.getElementById("summary-subtotal");
          if (summarySubtotal) {
            summarySubtotal.textContent = `${currencySymbol}${((orderSummary.subtotal || 0) / 100).toFixed(2)}`;
          }
          const summaryShipping = document.getElementById("summary-shipping");
          if (summaryShipping) {
            summaryShipping.textContent = `${currencySymbol}${((orderSummary.shipping || 0) / 100).toFixed(2)}`;
          }
          const summaryTax = document.getElementById("summary-tax");
          if (summaryTax) {
            summaryTax.textContent = `${currencySymbol}${((orderSummary.tax || 0) / 100).toFixed(2)}`;
          }
          const summaryTotal = document.getElementById("summary-total");
          if (summaryTotal) {
            summaryTotal.textContent = `${currencySymbol}${((orderSummary.total || 0) / 100).toFixed(2)}`;
          }
        }

        // Show order section
        if (lineItems.length > 0 || orderSummary.total !== undefined) {
          const orderSection = document.getElementById("order-section");
          if (orderSection) {
            orderSection.style.display = "block";
          }
        }
      }

      function showGenericThanks() {
        // Show success page without order details
      }

      function showOrderNotFoundError() {
        // Show friendly error if order/session not found
        const main = document.querySelector("main");
        if (main) {
          const errorMsg = document.createElement("div");
          errorMsg.style.cssText =
            "color: #ff6b6b; padding: 20px; background: #1a1a1a; border-radius: 8px; margin-top: 20px; border: 1px solid #ff6b6b";
          errorMsg.innerHTML =
            "<p style='margin: 0'>Order not found or payment incomplete. Please check your email for confirmation details.</p>";
          main.appendChild(errorMsg);
        }
      }

      function showApiErrorMessage() {
        // Show reassuring message if API call fails (order was still placed)
        const main = document.querySelector("main");
        if (main) {
          const infoMsg = document.createElement("div");
          infoMsg.style.cssText =
            "color: #ffc107; padding: 20px; background: #1a1a1a; border-radius: 8px; margin-top: 20px; border: 1px solid #ffc107";
          infoMsg.innerHTML =
            "<p style='margin: 0'>Your order was placed successfully! Check your email for order confirmation and shipping details.</p>";
          main.appendChild(infoMsg);
        }
      }
    </script>
