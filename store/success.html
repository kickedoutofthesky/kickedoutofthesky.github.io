<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Order Successful - Kicked Out of the Sky</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-1BmE4kWBq78iYhFldwKuhfstIfW+VxA0pqKiKIAKHIUyj4zYAI8/0WJ8v7oEsVrX"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
    <link rel="stylesheet" href="../css/ui.css" />
    <link rel="stylesheet" href="assets/css/styles.css" />
    <script src="js/api-config.js"></script>
  </head>
  <body>
    <!-- Navbar -->
    <nav
      id="navbarMain"
      class="navbar navbar-expand site-header fixed-top"
      style="padding: 15px 40px 15px 0; background-color: #00000080"
    >
      <div class="container-fluid" style="display: flex; justify-content: space-between; align-items: center">
        <a href="../index.html" style="flex-shrink: 0; display: flex; align-items: center">
          <img
            class="brand"
            src="../img/Kicked-Out-Of-The-Sky_transparent.png"
            alt="Kicked Out of the Sky Logo"
            style="width: auto; display: block"
          />
        </a>
        <ul class="nav" style="gap: 30px; display: flex; flex-wrap: nowrap; margin: 0; list-style: none">
          <li class="nav-item">
            <a
              class="nav-link"
              href="index.html"
              style="
                color: #999;
                text-decoration: none;
                font-size: 1.2rem;
                display: flex;
                align-items: center;
                transition: ease-in-out color 0.15s;
                cursor: pointer;
              "
              onmouseover="this.style.color = '#fff'"
              onmouseout="this.style.color = '#999'"
            >
              Merch
            </a>
          </li>
          <li class="nav-item" style="position: relative">
            <a
              class="nav-link"
              href="cart.html"
              style="
                color: #999;
                text-decoration: none;
                font-size: 1.2rem;
                display: flex;
                align-items: center;
                gap: 8px;
                transition: ease-in-out color 0.15s;
                cursor: pointer;
              "
              onmouseover="this.style.color = '#fff'"
              onmouseout="this.style.color = '#999'"
            >
              <i class="fas fa-shopping-cart"></i>
              Cart
              <span
                id="cart-badge"
                class="badge"
                style="
                  background-color: #ffc107;
                  color: #000;
                  position: absolute;
                  top: -5px;
                  right: -10px;
                  display: none;
                  font-size: 0.7rem;
                  width: 20px;
                  height: 20px;
                  border-radius: 50%;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  padding: 0;
                "
              >
                0
              </span>
            </a>
          </li>
        </ul>
      </div>
    </nav>

    <div style="margin-top: 100px">
      <div class="container">
        <main>
          <div style="text-align: center; margin-bottom: 40px">
            <h1 style="color: #fff; margin-bottom: 20px">✓ Order Successful</h1>
            <p style="color: #ccc; margin-bottom: 10px; font-size: 1.1rem">Thank you for your purchase!</p>
            <p id="order-id-display" style="color: #ffc107; font-family: monospace; font-size: 0.9rem; margin: 0"></p>
          </div>

          <!-- Two Column Layout: Order (Left) + Shipping (Right) -->
          <div
            style="
              display: grid;
              grid-template-columns: 1fr 1fr;
              gap: 30px;
              margin-bottom: 40px;
            "
            class="order-shipping-grid"
          >
            <!-- LEFT COLUMN: Order Items -->
            <div
              id="order-section"
              style="
                background: #1a1a1a;
                padding: 30px;
                border-radius: 8px;
                border: 1px solid #333;
                display: none;
              "
            >
              <h3 style="color: #fff; margin-bottom: 25px; margin-top: 0">Order Items</h3>

              <!-- Order Items List -->
              <div id="order-items" style="margin-bottom: 25px; max-height: 300px; overflow-y: auto">
                <!-- Items populated by script -->
              </div>

              <!-- Cost Breakdown -->
              <div style="border-top: 1px solid #333; padding-top: 20px; margin-top: 20px">
                <div
                  style="
                    display: flex;
                    justify-content: space-between;
                    color: #ccc;
                    margin-bottom: 12px;
                    font-size: 0.95rem;
                  "
                >
                  <span>Subtotal:</span>
                  <span id="summary-subtotal">$0.00</span>
                </div>
                <div
                  style="
                    display: flex;
                    justify-content: space-between;
                    color: #ccc;
                    margin-bottom: 12px;
                    font-size: 0.95rem;
                  "
                >
                  <span>Shipping:</span>
                  <span id="summary-shipping">$0.00</span>
                </div>
                <div
                  style="
                    display: flex;
                    justify-content: space-between;
                    color: #ccc;
                    margin-bottom: 15px;
                    font-size: 0.95rem;
                  "
                >
                  <span>Tax:</span>
                  <span id="summary-tax">$0.00</span>
                </div>
                <div
                  style="
                    display: flex;
                    justify-content: space-between;
                    color: #ffc107;
                    font-weight: bold;
                    font-size: 1.15rem;
                    border-top: 1px solid #333;
                    padding-top: 15px;
                  "
                >
                  <span>Total:</span>
                  <span id="summary-total">$0.00</span>
                </div>
              </div>
            </div>

            <!-- RIGHT COLUMN: Customer & Shipping Info -->
            <div style="display: flex; flex-direction: column; gap: 20px">
              <!-- Customer Info Card -->
              <div
                id="customer-section"
                style="
                  background: #1a1a1a;
                  padding: 25px;
                  border-radius: 8px;
                  border: 1px solid #333;
                  display: none;
                "
              >
                <h4 style="color: #fff; margin-bottom: 15px; margin-top: 0; font-size: 0.95rem">
                  Order Confirmation Sent To:
                </h4>
                <div id="customer-name" style="color: #ffc107; font-weight: 500; margin-bottom: 8px"></div>
                <div id="customer-email" style="color: #ccc; font-size: 0.9rem; margin-bottom: 5px"></div>
                <div id="customer-phone" style="color: #999; font-size: 0.9rem"></div>
              </div>

              <!-- Shipping Info Card -->
              <div
                id="shipping-section"
                style="
                  background: #1a1a1a;
                  padding: 25px;
                  border-radius: 8px;
                  border: 1px solid #333;
                  display: none;
                "
              >
                <h4 style="color: #fff; margin-bottom: 15px; margin-top: 0; font-size: 0.95rem">Shipping Address</h4>
                <div id="shipping-address" style="color: #ccc; font-size: 0.9rem; line-height: 1.8">
                  <!-- Address populated by script -->
                </div>
                <div id="shipping-method-section" style="margin-top: 15px; border-top: 1px solid #333; padding-top: 15px; display: none">
                  <div style="color: #999; font-size: 0.85rem; margin-bottom: 5px">Shipping Method:</div>
                  <div id="shipping-method" style="color: #ffc107; font-weight: 500"></div>
                </div>
              </div>
            </div>
          </div>

            <a href="index.html" class="btn btn-warning btn-sm">Return to Store</a>
          </div>
        </main>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/cart-notification.js"></script>
    <script>
      // Retrieve order details from Stripe session (appended by Stripe redirect)
      document.addEventListener("DOMContentLoaded", async () => {
        // Extract session_id from URL params (Stripe appends ?session_id=cs_test_...)
        const params = new URLSearchParams(window.location.search);
        const sessionId = params.get("session_id");

        if (!sessionId) {
          // No session ID provided — customer navigated here directly or session expired
          console.warn("No session ID found in URL");
          showGenericThanks();
          return;
        }

        // Display order reference
        document.getElementById("order-ref").style.display = "block";
        document.getElementById("session-id").textContent = sessionId;

        // Fetch order details from backend
        try {
          const backendUrl = window.__API_URL__ || "https://kickedoutofthesky-store.vercel.app";
          const response = await fetch(`${backendUrl}/api/order-details?session_id=${encodeURIComponent(sessionId)}`);

          if (!response.ok) {
            if (response.status === 404) {
              // Session not found or not paid
              console.error("Order not found or payment incomplete");
              showOrderNotFoundError();
              return;
            } else if (response.status === 401) {
              // Unauthorized (session doesn't belong to this store)
              console.error("Unauthorized access to session");
              showGenericThanks();
              return;
            } else {
              throw new Error(`API error: ${response.status}`);
            }
          }

          const data = await response.json();
          console.log("Order details API response:", data);

          // Update order reference with orderId if available
          if (data.orderId) {
            document.getElementById("session-id").textContent = data.orderId;
            // Also update the order ID display
            document.getElementById("order-id-display").textContent = `Order #${data.orderId}`;
            document.getElementById("order-id-display").style.display = "block";
          }

          // Validate response contains expected data
          // Display if we have any order data (items, summary, shipping, etc)
          if (data.lineItems || data.orderSummary || data.shippingDetails || data.shippingAddress) {
            displayOrderDetails(data);
            // Clear cart and saved country now that payment is confirmed
            if (typeof cart !== "undefined" && cart && typeof cart.clear === "function") {
              cart.clear();
            }
            localStorage.removeItem("selectedShippingCountry");
          } else {
            // Fallback if no meaningful data returned
            console.warn("No order data found in response");
            showGenericThanks();
          }
        } catch (error) {
          console.error("Error fetching order details:", error);
          console.error("Error details:", {
            message: error.message,
            status: error.status,
            stack: error.stack
          });
          // API failed, but order was placed — show reassuring message
          showApiErrorMessage();
        }
      });

      function displayOrderDetails(data) {
        console.log("displayOrderDetails called with:", data);

        // Map API response fields (may vary based on backend implementation)
        const customer = data.customer || data.customerDetails || {};
        let shippingAddress = data.shippingAddress;
        if (!shippingAddress && data.shippingDetails?.address) {
          shippingAddress = {
            name: data.shippingDetails.name,
            line1: data.shippingDetails.address.line1,
            line2: data.shippingDetails.address.line2,
            city: data.shippingDetails.address.city,
            state: data.shippingDetails.address.state,
            postal_code: data.shippingDetails.address.postal_code,
            country: data.shippingDetails.address.country
          };
        }
        shippingAddress = shippingAddress || {};

        const shippingMethod = data.shippingMethod || data.shippingOption;
        const orderSummary = data.orderSummary || {};
        let lineItems = data.lineItems || [];

        // Map line items if they use 'description' and 'amount_total' instead of 'name' and 'amount'
        lineItems = lineItems.map(item => ({
          name: item.name || item.description || "Item",
          quantity: item.quantity || 1,
          unitPrice: item.unitPrice !== undefined ? item.unitPrice : item.unit_price,
          amount: item.amount !== undefined ? item.amount : item.amount_total
        }));

        const currency = data.currency || "USD";
        const currencySymbol = currency === "USD" ? "$" : currency;

        console.log("Parsed data:", {
          customer,
          shippingAddress,
          orderSummary,
          lineItems: lineItems.length,
          currency
        });

        // Display customer info
        if (customer.email || customer.name || customer.phone) {
          console.log("Displaying customer info");
          if (customer.name) {
            document.getElementById("customer-name").textContent = customer.name;
          }
          if (customer.email) {
            document.getElementById("customer-email").textContent = customer.email;
          }
          if (customer.phone) {
            document.getElementById("customer-phone").textContent = customer.phone;
          }
          const customerSection = document.getElementById("customer-section");
          if (customerSection) {
            customerSection.style.display = "block";
          }
        }

        // Display shipping address
        if (shippingAddress.line1 || shippingAddress.city || shippingAddress.country) {
          console.log("Displaying shipping address");
          const addressDiv = document.getElementById("shipping-address");
          if (addressDiv) {
            const parts = [];

            if (shippingAddress.name) parts.push(`<strong>${shippingAddress.name}</strong>`);
            if (shippingAddress.line1) parts.push(shippingAddress.line1);
            if (shippingAddress.line2) parts.push(shippingAddress.line2);

            const cityStateZip = [shippingAddress.city, shippingAddress.state, shippingAddress.postal_code]
              .filter(Boolean)
              .join(" ");
            if (cityStateZip) parts.push(cityStateZip);

            if (shippingAddress.country) parts.push(shippingAddress.country);

            console.log("Address parts:", parts);
            addressDiv.innerHTML = parts.join("<br>");
            const shippingSection = document.getElementById("shipping-section");
            if (shippingSection) {
              shippingSection.style.display = "block";
            }
          }
        }

        // Display shipping method if available
        if (shippingMethod) {
          console.log("Displaying shipping method:", shippingMethod);
          const methodSection = document.getElementById("shipping-method-section");
          if (methodSection) {
            document.getElementById("shipping-method").textContent = shippingMethod;
            methodSection.style.display = "block";
          }
          const shippingSection = document.getElementById("shipping-section");
          if (shippingSection) {
            shippingSection.style.display = "block";
          }
        }

        // Display order items with unit prices and line totals
        if (lineItems.length > 0) {
          console.log("Displaying order items:", lineItems.length);
          const itemsDiv = document.getElementById("order-items");
          if (itemsDiv) {
            itemsDiv.innerHTML = lineItems
              .map(item => {
                const unitPrice = (item.unitPrice || 0) / 100;
                const lineTotal = (item.amount || 0) / 100;
                return `<div style="margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid #333">
                  <div style="display: flex; justify-content: space-between; margin-bottom: 6px">
                    <div>${item.name || "Item"}</div>
                    <div style="font-weight: bold">${currencySymbol}${lineTotal.toFixed(2)}</div>
                  </div>
                  <div style="display: flex; justify-content: space-between; color: #999; font-size: 0.85rem">
                    <div>Qty: ${item.quantity || 1} × ${currencySymbol}${unitPrice.toFixed(2)} each</div>
                  </div>
                </div>`;
              })
              .join("");
          }
        }

        // Display cost breakdown
        if (orderSummary.subtotal !== undefined || orderSummary.shipping !== undefined || orderSummary.tax !== undefined || orderSummary.total !== undefined) {
          console.log("Displaying cost breakdown");
          const summarySubtotal = document.getElementById("summary-subtotal");
          if (summarySubtotal) {
            summarySubtotal.textContent = `${currencySymbol}${((orderSummary.subtotal || 0) / 100).toFixed(2)}`;
          }
          const summaryShipping = document.getElementById("summary-shipping");
          if (summaryShipping) {
            summaryShipping.textContent = `${currencySymbol}${((orderSummary.shipping || 0) / 100).toFixed(2)}`;
          }
          const summaryTax = document.getElementById("summary-tax");
          if (summaryTax) {
            summaryTax.textContent = `${currencySymbol}${((orderSummary.tax || 0) / 100).toFixed(2)}`;
          }
          const summaryTotal = document.getElementById("summary-total");
          if (summaryTotal) {
            summaryTotal.textContent = `${currencySymbol}${((orderSummary.total || 0) / 100).toFixed(2)}`;
          }
        }

        // Show order section
        if (lineItems.length > 0 || orderSummary.total !== undefined) {
          console.log("Showing order section");
          const orderSection = document.getElementById("order-section");
          if (orderSection) {
            orderSection.style.display = "block";
          }
        }
      }

      function showGenericThanks() {
        // Show success page without order details
        console.log("Showing generic thank you message");
      }

      function showOrderNotFoundError() {
        // Show friendly error if order/session not found
        const successMessage = document.querySelector(".success-message");
        const errorMsg = document.createElement("div");
        errorMsg.style.cssText =
          "color: #ff6b6b; padding: 20px; background: #1a1a1a; border-radius: 8px; margin-top: 20px; border: 1px solid #ff6b6b";
        errorMsg.innerHTML =
          "<p style='margin: 0'>Order not found or payment incomplete. Please check your email for confirmation details.</p>";
        successMessage.appendChild(errorMsg);
      }

      function showApiErrorMessage() {
        // Show reassuring message if API call fails (order was still placed)
        const successMessage = document.querySelector(".success-message");
        const infoMsg = document.createElement("div");
        infoMsg.style.cssText =
          "color: #ffc107; padding: 20px; background: #1a1a1a; border-radius: 8px; margin-top: 20px; border: 1px solid #ffc107";
        infoMsg.innerHTML =
          "<p style='margin: 0'>Your order was placed successfully! Check your email for order confirmation and shipping details.</p>";
        successMessage.appendChild(infoMsg);
      }
    </script>
  </body>
</html>
