<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Order Successful - Kicked Out of the Sky</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-1BmE4kWBq78iYhFldwKuhfstIfW+VxA0pqKiKIAKHIUyj4zYAI8/0WJ8v7oEsVrX"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
    <link rel="stylesheet" href="../css/ui.css" />
    <link rel="stylesheet" href="assets/css/styles.css" />
    <script src="js/api-config.js"></script>
  </head>
  <body>
    <!-- Navbar -->
    <nav
      id="navbarMain"
      class="navbar navbar-expand site-header fixed-top"
      style="padding: 15px 40px 15px 0; background-color: #00000080"
    >
      <div class="container-fluid" style="display: flex; justify-content: space-between; align-items: center">
        <a href="../index.html" style="flex-shrink: 0; display: flex; align-items: center">
          <img
            class="brand"
            src="../img/Kicked-Out-Of-The-Sky_transparent.png"
            alt="Kicked Out of the Sky Logo"
            style="width: auto; display: block"
          />
        </a>
        <ul class="nav" style="gap: 30px; display: flex; flex-wrap: nowrap; margin: 0; list-style: none">
          <li class="nav-item">
            <a
              class="nav-link"
              href="index.html"
              style="
                color: #999;
                text-decoration: none;
                font-size: 1.2rem;
                display: flex;
                align-items: center;
                transition: ease-in-out color 0.15s;
                cursor: pointer;
              "
              onmouseover="this.style.color = '#fff'"
              onmouseout="this.style.color = '#999'"
            >
              Merch
            </a>
          </li>
          <li class="nav-item" style="position: relative">
            <a
              class="nav-link"
              href="cart.html"
              style="
                color: #999;
                text-decoration: none;
                font-size: 1.2rem;
                display: flex;
                align-items: center;
                gap: 8px;
                transition: ease-in-out color 0.15s;
                cursor: pointer;
              "
              onmouseover="this.style.color = '#fff'"
              onmouseout="this.style.color = '#999'"
            >
              <i class="fas fa-shopping-cart"></i>
              Cart
              <span
                id="cart-badge"
                class="badge"
                style="
                  background-color: #ffc107;
                  color: #000;
                  position: absolute;
                  top: -5px;
                  right: -10px;
                  display: none;
                  font-size: 0.7rem;
                  width: 20px;
                  height: 20px;
                  border-radius: 50%;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  padding: 0;
                "
              >
                0
              </span>
            </a>
          </li>
        </ul>
      </div>
    </nav>

    <div style="margin-top: 100px">
      <div class="container">
        <main>
          <div class="success-message" style="text-align: center; padding: 60px 20px">
            <h1 style="color: #fff; margin-bottom: 20px">✓ Order Successful</h1>
            <p style="color: #ccc; margin-bottom: 30px; font-size: 1.1rem">Thank you for your purchase!</p>
            <div
              id="order-ref"
              style="
                margin-bottom: 30px;
                padding: 20px;
                background: #1a1a1a;
                border-radius: 8px;
                border: 1px solid #333;
                display: none;
              "
            >
              <p style="color: #999; margin: 0 0 10px 0; font-size: 0.9rem">Order Reference:</p>
              <p
                id="session-id"
                style="color: #ffc107; margin: 0; font-weight: bold; font-family: monospace; font-size: 1rem"
              ></p>
            </div>

            <!-- Shipping Details Section -->
            <div
              id="shipping-details"
              style="
                margin-bottom: 30px;
                padding: 20px;
                background: #1a1a1a;
                border-radius: 8px;
                border: 1px solid #333;
                display: none;
                text-align: left;
              "
            >
              <p style="color: #999; margin: 0 0 15px 0; font-size: 0.9rem; font-weight: bold">Shipping Address:</p>
              <div id="shipping-address" style="color: #ccc; margin-bottom: 15px; font-size: 0.95rem; line-height: 1.6">
                <!-- Address populated by script -->
              </div>
              <p style="color: #999; margin: 0 0 8px 0; font-size: 0.9rem; font-weight: bold">Shipping Method:</p>
              <p id="shipping-method" style="color: #ffc107; margin: 0; font-size: 0.95rem">
                <!-- Shipping method populated by script -->
              </p>
            </div>

            <!-- Order Summary Section -->
            <div
              id="order-summary"
              style="
                margin-bottom: 30px;
                padding: 20px;
                background: #1a1a1a;
                border-radius: 8px;
                border: 1px solid #333;
                display: none;
                text-align: left;
              "
            >
              <p style="color: #999; margin: 0 0 15px 0; font-size: 0.9rem; font-weight: bold">Order Items:</p>
              <div id="order-items" style="color: #ccc; margin-bottom: 20px; font-size: 0.95rem">
                <!-- Items populated by script -->
              </div>

              <div style="border-top: 1px solid #333; padding-top: 15px">
                <div
                  style="
                    display: flex;
                    justify-content: space-between;
                    color: #ccc;
                    margin-bottom: 8px;
                    font-size: 0.95rem;
                  "
                >
                  <span>Subtotal:</span>
                  <span id="summary-subtotal">$0.00</span>
                </div>
                <div
                  style="
                    display: flex;
                    justify-content: space-between;
                    color: #ccc;
                    margin-bottom: 8px;
                    font-size: 0.95rem;
                  "
                >
                  <span>Shipping:</span>
                  <span id="summary-shipping">$0.00</span>
                </div>
                <div
                  style="
                    display: flex;
                    justify-content: space-between;
                    color: #ccc;
                    margin-bottom: 15px;
                    font-size: 0.95rem;
                  "
                >
                  <span>Tax:</span>
                  <span id="summary-tax">$0.00</span>
                </div>
                <div
                  style="
                    display: flex;
                    justify-content: space-between;
                    color: #ffc107;
                    font-weight: bold;
                    font-size: 1.1rem;
                    border-top: 1px solid #333;
                    padding-top: 15px;
                  "
                >
                  <span>Total:</span>
                  <span id="summary-total">$0.00</span>
                </div>
              </div>
            </div>
            <a href="index.html" class="btn btn-warning btn-sm">Return to Store</a>
          </div>
        </main>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/cart-notification.js"></script>
    <script>
      // Retrieve order details from Stripe session (appended by Stripe redirect)
      document.addEventListener("DOMContentLoaded", async () => {
        // Extract session_id from URL params (Stripe appends ?session_id=cs_test_...)
        const params = new URLSearchParams(window.location.search);
        const sessionId = params.get("session_id");

        if (!sessionId) {
          // No session ID provided — customer navigated here directly or session expired
          console.warn("No session ID found in URL");
          showGenericThanks();
          return;
        }

        // Display order reference
        document.getElementById("order-ref").style.display = "block";
        document.getElementById("session-id").textContent = sessionId;

        // Fetch order details from backend
        try {
          const backendUrl = window.__API_URL__ || "https://kickedoutofthesky-store.vercel.app";
          const response = await fetch(`${backendUrl}/api/order-details?session_id=${encodeURIComponent(sessionId)}`);

          if (!response.ok) {
            if (response.status === 404) {
              // Session not found or not paid
              console.error("Order not found or payment incomplete");
              showOrderNotFoundError();
              return;
            } else if (response.status === 401) {
              // Unauthorized (session doesn't belong to this store)
              console.error("Unauthorized access to session");
              showGenericThanks();
              return;
            } else {
              throw new Error(`API error: ${response.status}`);
            }
          }

          const data = await response.json();

          // Validate response contains expected data
          // Display if we have any order data (items, summary, shipping, etc)
          if (data.lineItems || data.orderSummary || data.shippingDetails) {
            displayOrderDetails(data);
          } else {
            // Fallback if no meaningful data returned
            showGenericThanks();
          }
        } catch (error) {
          console.error("Error fetching order details:", error);
          // API failed, but order was placed — show reassuring message
          showApiErrorMessage();
        }
      });

      function displayOrderDetails(data) {
        const shippingDetails = data.shippingDetails;
        const shippingOption = data.shippingOption;
        const orderSummary = data.orderSummary;
        const lineItems = data.lineItems;
        const customerEmail = data.customerEmail;

        // Display shipping details
        if (shippingDetails) {
          const addressDiv = document.getElementById("shipping-address");
          const address = shippingDetails.address || {};

          addressDiv.innerHTML = `
            <div>
              <strong>${shippingDetails.name || ""}</strong><br>
              ${address.line1 || ""}<br>
              ${address.line2 ? address.line2 + "<br>" : ""}
              ${address.city || ""}, ${address.state || ""} ${address.postal_code || ""}<br>
              ${address.country || ""}
            </div>
          `;

          document.getElementById("shipping-details").style.display = "block";
        }

        if (shippingOption) {
          const methodEl = document.getElementById("shipping-method");
          methodEl.textContent = shippingOption;
          document.getElementById("shipping-details").style.display = "block";
        }

        // Display order items and summary
        if (lineItems && lineItems.length > 0) {
          const itemsDiv = document.getElementById("order-items");
          itemsDiv.innerHTML = lineItems
            .map(
              item =>
                `<div style="display: flex; justify-content: space-between; margin-bottom: 10px">
                  <div>
                    <div>${item.description || item.name || "Item"}</div>
                    <div style="color: #999; font-size: 0.85rem">Qty: ${item.quantity || 1}</div>
                  </div>
                  <div style="text-align: right; font-weight: bold">
                    $${((item.amount_total || 0) / 100).toFixed(2)}
                  </div>
                </div>`
            )
            .join("");

          document.getElementById("order-summary").style.display = "block";
        }

        // Display cost breakdown
        if (orderSummary) {
          document.getElementById("summary-subtotal").textContent = `$${((orderSummary.subtotal || 0) / 100).toFixed(
            2
          )}`;
          document.getElementById("summary-shipping").textContent = `$${((orderSummary.shipping || 0) / 100).toFixed(
            2
          )}`;
          document.getElementById("summary-tax").textContent = `$${((orderSummary.tax || 0) / 100).toFixed(2)}`;
          document.getElementById("summary-total").textContent = `$${((orderSummary.total || 0) / 100).toFixed(2)}`;

          document.getElementById("order-summary").style.display = "block";
        }

        // Display email if available
        if (customerEmail) {
          console.log(`Order confirmation sent to: ${customerEmail}`);
        }
      }

      function showGenericThanks() {
        // Show success page without order details
        console.log("Showing generic thank you message");
      }

      function showOrderNotFoundError() {
        // Show friendly error if order/session not found
        const successMessage = document.querySelector(".success-message");
        const errorMsg = document.createElement("div");
        errorMsg.style.cssText =
          "color: #ff6b6b; padding: 20px; background: #1a1a1a; border-radius: 8px; margin-top: 20px; border: 1px solid #ff6b6b";
        errorMsg.innerHTML =
          "<p style='margin: 0'>Order not found or payment incomplete. Please check your email for confirmation details.</p>";
        successMessage.appendChild(errorMsg);
      }

      function showApiErrorMessage() {
        // Show reassuring message if API call fails (order was still placed)
        const successMessage = document.querySelector(".success-message");
        const infoMsg = document.createElement("div");
        infoMsg.style.cssText =
          "color: #ffc107; padding: 20px; background: #1a1a1a; border-radius: 8px; margin-top: 20px; border: 1px solid #ffc107";
        infoMsg.innerHTML =
          "<p style='margin: 0'>Your order was placed successfully! Check your email for order confirmation and shipping details.</p>";
        successMessage.appendChild(infoMsg);
      }
    </script>
  </body>
</html>
