<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Order Successful - Kicked Out of the Sky</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-1BmE4kWBq78iYhFldwKuhfstIfW+VxA0pqKiKIAKHIUyj4zYAI8/0WJ8v7oEsVrX"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
    <link rel="stylesheet" href="../css/ui.css" />
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body>
    <!-- Navbar -->
    <nav
      id="navbarMain"
      class="navbar navbar-expand site-header fixed-top"
      style="padding: 15px 40px 15px 0; background-color: #000"
    >
      <div class="container-fluid" style="display: flex; justify-content: space-between; align-items: center">
        <a href="../index.html" style="flex-shrink: 0; display: flex; align-items: center">
          <img
            class="brand"
            src="../img/Kicked-Out-Of-The-Sky_transparent.png"
            alt="Kicked Out of the Sky Logo"
            style="width: auto; display: block"
          />
        </a>
        <ul class="nav" style="gap: 30px; display: flex; flex-wrap: nowrap; margin: 0; list-style: none">
          <li class="nav-item">
            <a
              class="nav-link"
              href="index.html"
              style="
                color: #999;
                text-decoration: none;
                font-size: 1.2rem;
                transition: ease-in-out color 0.15s;
                cursor: pointer;
              "
              onmouseover="this.style.color = '#fff'"
              onmouseout="this.style.color = '#999'"
            >
              Merch
            </a>
          </li>
          <li class="nav-item" style="position: relative">
            <a
              class="nav-link"
              href="cart.html"
              style="
                color: #999;
                text-decoration: none;
                font-size: 1.2rem;
                display: flex;
                align-items: center;
                gap: 8px;
                transition: ease-in-out color 0.15s;
                cursor: pointer;
              "
              onmouseover="this.style.color = '#fff'"
              onmouseout="this.style.color = '#999'"
            >
              <i class="fas fa-shopping-cart"></i>
              Cart
              <span
                id="cart-badge"
                class="badge"
                style="
                  background-color: #ffc107;
                  color: #000;
                  position: absolute;
                  top: -5px;
                  right: -10px;
                  display: none;
                  font-size: 0.7rem;
                  width: 20px;
                  height: 20px;
                  border-radius: 50%;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  padding: 0;
                "
              >
                0
              </span>
            </a>
          </li>
        </ul>
      </div>
    </nav>

    <div style="margin-top: 100px">
      <div class="container">
        <main>
          <div class="success-message" style="text-align: center; padding: 60px 20px">
            <h1 style="color: #fff; margin-bottom: 20px">✓ Order Successful</h1>
            <p style="color: #ccc; margin-bottom: 30px; font-size: 1.1rem">Thank you for your purchase!</p>
            <div
              id="order-ref"
              style="
                margin-bottom: 30px;
                padding: 20px;
                background: #1a1a1a;
                border-radius: 8px;
                border: 1px solid #333;
                display: none;
              "
            >
              <p style="color: #999; margin: 0 0 10px 0; font-size: 0.9rem">Order Reference:</p>
              <p
                id="session-id"
                style="color: #ffc107; margin: 0; font-weight: bold; font-family: monospace; font-size: 1rem"
              ></p>
            </div>
            <a href="index.html" class="btn btn-warning btn-sm">Return to Store</a>
          </div>
        </main>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/cart-notification.js"></script>
    <script>
      // Display order reference from checkout session
      document.addEventListener("DOMContentLoaded", () => {
        const sessionId = sessionStorage.getItem("checkoutSessionId");
        if (sessionId) {
          document.getElementById("order-ref").style.display = "block";
          document.getElementById("session-id").textContent = sessionId;
          // Clear the session ID after displaying it
          sessionStorage.removeItem("checkoutSessionId");
        }
      });
    </script>
  </body>
</html>
