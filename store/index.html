    <link rel="stylesheet" href="../css/ui.css" />

  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-light sticky-top" style="background-color: rgba(255, 255, 255, 0.95)">
      <div class="container-fluid">
        <a class="navbar-brand" href="../index.html">KOTS</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="../index.html#music">Music</a></li>
            <li class="nav-item"><a class="nav-link" href="../index.html#videos">Videos</a></li>

      <div class="text-center mb-5">

        <h4 class="alert-heading">Error</h4>
        <p>Failed to load products. Please try again later or contact support.</p>
      </div>
    </div>
