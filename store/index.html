<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Store - Kicked Out of the Sky</title>
    <meta
      name="description"
      content="Official Kicked Out of the Sky merch store. Shop tees, hoodies, long sleeve tees, hats, and stickers."
    />
    <link rel="icon" href="../img/star-64.ico" />
    <link rel="apple-touch-icon" href="../img/star-64.ico" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
      media="print"
      onload="this.media = 'all'"
    />
    <link rel="stylesheet" href="../css/ui.css" />
    <link rel="stylesheet" href="assets/css/styles.css" />
    <script defer src="js/api-config.js"></script>
  </head>
  <body class="text-center">
    <a href="#main-content" class="skip-nav">Skip to content</a>
    <!-- Navbar -->
    <nav
      id="navbarMain"
      class="navbar navbar-expand site-header fixed-top"
      style="padding: 15px 40px 15px 0; background-color: #00000080"
    >
      <div class="container-fluid" style="display: flex; justify-content: space-between; align-items: center">
        <a href="../index.html" style="flex-shrink: 0; display: flex; align-items: center">
          <img
            class="brand"
            src="../img/Kicked-Out-Of-The-Sky_transparent.png"
            alt="Kicked Out of the Sky Logo"
            style="width: auto; display: block"
          />
        </a>
        <ul class="nav" style="gap: 30px; display: flex; flex-wrap: nowrap; margin: 0; list-style: none">
          <li class="nav-item">
            <a
              class="nav-link"
              href="index.html"
              style="
                color: #999;
                text-decoration: none;
                font-size: 1.2rem;
                display: flex;
                align-items: center;
                transition: ease-in-out color 0.15s;
                cursor: pointer;
              "
              onmouseover="this.style.color = '#fff'"
              onmouseout="this.style.color = '#999'"
            >
              Merch
            </a>
          </li>
          <li class="nav-item" style="position: relative">
            <a
              class="nav-link"
              href="cart.html"
              style="
                color: #999;
                text-decoration: none;
                font-size: 1.2rem;
                display: flex;
                align-items: center;
                gap: 8px;
                transition: ease-in-out color 0.15s;
                cursor: pointer;
              "
              onmouseover="this.style.color = '#fff'"
              onmouseout="this.style.color = '#999'"
            >
              <i class="fas fa-shopping-cart"></i>
              Cart
              <span
                id="cart-badge"
                data-testid="cart-count"
                class="badge"
                style="
                  background-color: #ffc107;
                  color: #000;
                  position: absolute;
                  top: -5px;
                  right: -10px;
                  display: none;
                  font-size: 0.7rem;
                  width: 20px;
                  height: 20px;
                  border-radius: 50%;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  padding: 0;
                "
              >
                0
              </span>
            </a>
          </li>
        </ul>
      </div>
    </nav>

    <!-- Category Filter (fixed below navbar) -->
    <div
      id="category-filter"
      style="
        position: fixed;
        left: 0;
        right: 0;
        z-index: 100;
        background: #000;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: center;
        padding: 12px 0;
        border-bottom: 1px solid #1a1a1a;
      "
    >
      <button class="filter-btn active" data-category="all">All</button>
      <button class="filter-btn" data-category="tees">Tees</button>
      <button class="filter-btn" data-category="long-sleeve">Long Sleeve Tees</button>
      <button class="filter-btn" data-category="hoodies">Hoodies</button>
      <button class="filter-btn" data-category="hats">Hats</button>
      <button class="filter-btn" data-category="stickers">Stickers</button>
    </div>

    <div id="main-content">
      <div class="container">
        <main>
          <!-- Product Grid -->
          <div class="products-grid" id="products-grid" data-testid="product-grid">
            <div style="text-align: center; grid-column: 1 / -1; padding: 40px">
              <p>Loading products...</p>
            </div>
          </div>

          <!-- Error State -->
          <div id="error-state" style="display: none; text-align: center; padding: 40px; color: #cb2431">
            <h2>Error Loading Products</h2>
            <p>Failed to load products. Please try again.</p>
          </div>
        </main>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/cart.js"></script>
    <script src="./js/store.js"></script>
    <script>
      function positionFilterBar() {
        const navbar = document.getElementById("navbarMain");
        const filter = document.getElementById("category-filter");
        const content = document.getElementById("main-content");
        if (navbar && filter) {
          const navHeight = navbar.offsetHeight;
          filter.style.top = navHeight + "px";
          if (content) {
            content.style.marginTop = navHeight + filter.offsetHeight + "px";
          }
        }
      }
      positionFilterBar();
      window.addEventListener("resize", positionFilterBar);
    </script>
  </body>
</html>
