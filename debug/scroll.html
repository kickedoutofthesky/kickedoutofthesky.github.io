<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Scroll diagnostics - Kicked Out Of The Sky</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
    <link rel="stylesheet" href="/css/ui.css" />
    <link rel="stylesheet" href="/store/assets/css/styles.css" />
    <style>
      .row-marker {
        height: 50px;
        border-top: 1px solid #333;
        color: #888;
        font-size: 0.8rem;
        text-align: left;
        padding: 4px 12px;
      }
      #diag {
        position: fixed;
        left: 8px;
        right: 8px;
        bottom: calc(env(safe-area-inset-bottom) + 70px);
        z-index: 2000;
        background: rgba(20, 20, 20, 0.92);
        border: 1px solid #ffc107;
        border-radius: 8px;
        color: #fff;
        font:
          11px/1.4 ui-monospace,
          Menlo,
          monospace;
        padding: 8px;
        text-align: left;
      }
      #diag button {
        font:
          11px ui-monospace,
          Menlo,
          monospace;
        margin: 4px 4px 0 0;
        padding: 4px 6px;
        background: #333;
        color: #ffc107;
        border: 1px solid #555;
        border-radius: 4px;
      }
      #diag-log {
        color: #aaa;
        max-height: 60px;
        overflow: hidden;
      }
    </style>
  </head>
  <body class="text-center">
    <!-- Temporary diagnostic page for the iPhone Chrome scroll bug. Not linked anywhere; remove when done. -->
    <!-- Navbar loaded dynamically from navbar.html (same as the store pages) -->

    <div id="main-content">
      <div class="container">
        <h1 id="page-top" class="text-light mb-40">TOP OF PAGE</h1>
        <p style="color: #999">Scroll down a long way, then back up. This heading should end up fully visible.</p>
        <div id="rows"></div>
      </div>
    </div>

    <div id="diag">
      <div id="diag-values">loading…</div>
      <div id="diag-log"></div>
      <div>
        <button type="button" id="toggle-smooth"></button>
        <button type="button" id="toggle-sticky"></button>
        <button type="button" id="toggle-blur"></button>
      </div>
    </div>

    <script src="/js/navbar-loader.js?v=20261026130000"></script>
    <script>
      (function () {
        // Numbered 50px rows so a screenshot shows exactly how far the page is from its top
        const rows = document.getElementById("rows");
        for (let i = 0; i < 120; i++) {
          const div = document.createElement("div");
          div.className = "row-marker";
          div.textContent = "row " + i;
          rows.appendChild(div);
        }

        // Experiments persist across reloads so they apply from page load
        const settings = JSON.parse(localStorage.getItem("scrollDiag") || "{}");
        const save = () => localStorage.setItem("scrollDiag", JSON.stringify(settings));
        const apply = () => {
          document.documentElement.style.scrollBehavior = settings.smoothOff ? "auto" : "";
          const nav = document.getElementById("navbarMain");
          if (nav) {
            nav.style.position = settings.navStatic ? "static" : "";
            nav.style.backdropFilter = settings.blurOff ? "none" : "";
            nav.style.webkitBackdropFilter = settings.blurOff ? "none" : "";
          }
          document.getElementById("toggle-smooth").textContent =
            "smooth scroll: " + (settings.smoothOff ? "OFF" : "on (default)");
          document.getElementById("toggle-sticky").textContent =
            "navbar: " + (settings.navStatic ? "NOT pinned" : "sticky (default)");
          document.getElementById("toggle-blur").textContent = "blur: " + (settings.blurOff ? "OFF" : "on (default)");
        };
        const toggle = key => () => {
          settings[key] = !settings[key];
          save();
          apply();
        };
        document.getElementById("toggle-smooth").addEventListener("click", toggle("smoothOff"));
        document.getElementById("toggle-sticky").addEventListener("click", toggle("navStatic"));
        document.getElementById("toggle-blur").addEventListener("click", toggle("blurOff"));
        apply();

        // Live values
        const values = document.getElementById("diag-values");
        const log = document.getElementById("diag-log");
        const r = n => Math.round(n);
        const render = () => {
          const nav = document.getElementById("navbarMain");
          const vv = window.visualViewport;
          const top = document.getElementById("page-top").getBoundingClientRect();
          const navRect = nav ? nav.getBoundingClientRect() : null;
          values.innerHTML =
            "scrollY " +
            r(window.scrollY) +
            " | docTop " +
            r(document.documentElement.getBoundingClientRect().top) +
            "<br>innerH " +
            window.innerHeight +
            " | outerH " +
            window.outerHeight +
            " | screenH " +
            screen.height +
            (vv
              ? "<br>vv offTop " + r(vv.offsetTop) + " | vv pageTop " + r(vv.pageTop) + " | vv h " + r(vv.height)
              : "") +
            (navRect
              ? "<br>nav top " +
                r(navRect.top) +
                " bottom " +
                r(navRect.bottom) +
                " pos " +
                getComputedStyle(nav).position
              : "") +
            "<br>heading top " +
            r(top.top) +
            " | scroll-behavior " +
            getComputedStyle(document.documentElement).scrollBehavior;
          // The navbar arrives asynchronously; apply the experiments to it once it exists
          if (nav && !nav.dataset.diagApplied) {
            nav.dataset.diagApplied = "1";
            apply();
          }
        };
        const addLog = msg => {
          const line = document.createElement("div");
          line.textContent = new Date().toISOString().slice(17, 22) + " " + msg;
          log.prepend(line);
          while (log.childNodes.length > 4) log.removeChild(log.lastChild);
        };
        window.addEventListener("scroll", render, { passive: true });
        window.addEventListener("resize", () => {
          addLog("resize innerH " + window.innerHeight + " scrollY " + r(window.scrollY));
          render();
        });
        if (window.visualViewport) {
          window.visualViewport.addEventListener("resize", render);
          window.visualViewport.addEventListener("scroll", render);
        }
        setInterval(render, 500);
        render();
      })();
    </script>
  </body>
</html>
