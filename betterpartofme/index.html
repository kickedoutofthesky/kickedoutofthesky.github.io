    <style>
      body {
        background: #000;
        color: #fff;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
        font-family:
          "HelveticaNeue-Light", "Helvetica Neue Light", "Helvetica Neue", Helvetica, Arial, "Lucida Grande", sans-serif;
      }

      .release-container {
        width: 100%;
        max-width: 500px;
        display: flex;
        flex-direction: column;
        gap: 30px;
      }

      .release-cover-wrapper {
        position: relative;
        width: 100%;
        aspect-ratio: 1;
        overflow: hidden;
        border-radius: 8px;
        background: #111;
      }

      .release-cover {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .release-info {
        text-align: center;
      }

      .release-artist {
        font-size: 0.95rem;
        color: #999;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 10px;
      }

      .release-title {
        font-size: 2rem;
        font-weight: 300;
        margin-bottom: 10px;
        line-height: 1.2;
      }

      .release-date {
        font-size: 0.95rem;
        color: #666;
        margin-bottom: 30px;
      }

      .release-cta {
        background: #ffc107;
        color: #000;
        border: none;
        padding: 14px 32px;
        font-size: 1rem;
        font-weight: 600;
        text-decoration: none;
        border-radius: 4px;
        cursor: pointer;
        display: inline-block;
        transition: all 0.3s ease;
      }

      .release-cta:hover {
        background: #ffda4d;
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(255, 193, 7, 0.3);
      }

      .release-cta:focus {
        outline: 2px solid #ffc107;
        outline-offset: 2px;
      }

      .release-cta:active {
        transform: translateY(0);
      }

      .release-nav {
        position: fixed;
        top: 20px;
        left: 20px;
        z-index: 100;
      }

      .release-nav a {
        color: #999;
        font-size: 0.9rem;
        display: flex;
        align-items: center;
        gap: 6px;
        text-decoration: none;
        transition: color 0.2s;
      }

      .release-nav a:hover {
        color: #fff;
      }

      @media (max-width: 480px) {
        .release-title {
          font-size: 1.5rem;
        }

        .release-container {
          gap: 20px;
        }

        body {
          padding: 20px;
        }
      }
    </style>
  </head>
  <body>
    <a href="#main-content" class="skip-nav">Skip to content</a>

    <!-- Home navigation -->
    <nav class="release-nav">
      <a href="/" aria-label="Back to home">
        <i class="fas fa-arrow-left"></i>
        <span>Home</span>
      </a>
    </nav>

    <main id="main-content" class="release-container">
      <div class="release-cover-wrapper">
        <img id="release-cover" class="release-cover" src="" alt="Release cover art" />
      </div>

      <div class="release-info">
        <div class="release-artist" id="release-artist"></div>
        <h1 class="release-title" id="release-title"></h1>
        <div class="release-date" id="release-date"></div>
        <a id="release-cta" class="release-cta" href="#">Pre-save on Spotify</a>
      </div>
    </main>

    <!-- Cookie consent (blocks analytics until accepted) -->
    <script src="../js/cookie-consent.js"></script>

    <!-- GA (loaded after consent) -->
    <script src="../js/analytics.js"></script>

    <!-- Meta Pixel (loaded after consent) -->
    <script src="../js/meta-pixel.js"></script>

    <!-- Release logic (depends on fbq from meta-pixel.js) -->
    <script src="../js/releases.js"></script>

    <!-- Initialize page for this specific release -->
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        // /betterpartofme/ is a permanent page for this release
        window.initReleasePage("betterpartofme", false);
      });
    </script>
  </body>
</html>
