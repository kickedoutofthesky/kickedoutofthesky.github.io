  <body>
    <!-- Visually-hidden fallback link; the page auto-redirects. -->
    <a href="https://push.fm/ps/better-part-of-me" style="position: absolute; left: -9999px">
      Continue to Better Part Of Me
    </a>
    <!-- Without JavaScript: a visible link (a meta refresh here would also redirect link-preview bots) -->
    <noscript>
      <p style="font-family: sans-serif; text-align: center; padding-top: 40vh">
        <a href="https://push.fm/ps/better-part-of-me" style="color: #e10098">Pre-save Better Part Of Me</a>
      </p>
    </noscript>

    <!-- Meta Pixel: only initializes if the visitor previously accepted cookies -->
    <script src="/js/meta-pixel.js"></script>
    <script>
      (function () {
        var DEST = "https://push.fm/ps/better-part-of-me";

        // Carry ad/attribution params through to the pre-save link.
        try {
          var keep = ["utm_source", "utm_medium", "utm_campaign", "utm_content", "utm_term", "fbclid", "ttclid"];
          var here = new URLSearchParams(location.search);
          var out = new URL(DEST);
          keep.forEach(function (k) {
            if (here.has(k)) out.searchParams.set(k, here.get(k));
          });
          DEST = out.toString();
        } catch (e) {}

        // Only fire the pixel if the visitor has already accepted cookies (GDPR).
        var consented = false;
        try {
          consented = localStorage.getItem("cookie_consent") === "accepted";
        } catch (e) {}

        var delay = 250;
        if (consented && typeof window.fbq === "function") {
          window.fbq("track", "PageView");
          window.fbq("track", "Lead", { content_name: "Better Part Of Me redirect" });
          delay = 800; // give the pixel beacon time to send before leaving
        }

        setTimeout(function () {
          location.replace(DEST);
        }, delay);
      })();
    </script>
  </body>
</html>
