name: CI

on:
  push:
    branches: [gh-pages, development]
  pull_request:
    branches: [gh-pages, development]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v3

      - name: Scan for exposed credentials
        run: |
          echo "Scanning for exposed credentials..."
          set +e
          found_creds=0

          # Patterns to search for (with basic exclusions for docs)
          patterns=(
            "protection-bypass"
            "sk_live_"
            "sk_test_"
            "whsec_"
            "re_[A-Za-z0-9]{20,}"
            "Bearer [A-Za-z0-9._-]{25,}"
          )

          for pattern in "${patterns[@]}"; do
            # Search in tracked files, excluding documentation placeholders
            matches=$(git grep -l "$pattern" -- ':(exclude)*.md' ':(exclude)ENVIRONMENTS.md' ':(exclude)LOCAL_DEVELOPMENT.md' 2>/dev/null || true)

            if [ ! -z "$matches" ]; then
              echo "Found potential credential pattern '$pattern' in:"
              while IFS= read -r file; do
                # Skip if line contains documentation markers
                git grep -n "$pattern" "$file" | grep -v '\.\.\.' | grep -v 'YOUR_' | grep -v 'example' | grep -v 'placeholder' || true
                if [ ${PIPESTATUS[0]} -eq 0 ]; then
                  found_creds=1
                fi
              done <<< "$matches"
            fi
          done

          if [ $found_creds -eq 1 ]; then
            echo ""
            echo "❌ Error: Possible credentials found in source code!"
            echo "Do not commit credentials to this repository."
            exit 1
          fi

          echo "✓ No obvious credentials detected"
          set -e

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting
        run: npm run format:check

      - name: Run linter
        run: npm run lint

      - name: Run unit tests
        run: npm test -- --coverage

      - name: Upload test coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          fail_ci_if_error: false
