    <script type="text/javascript">
      // Contact form
      $("#submit").on("click", function (event) {
        event.preventDefault();

        var formData = {
          name: $("#name").val(),
          email: $("#email").val(),
          message: $("#message").val(),
        };

        $.ajax({
          url: "https://formspree.io/f/xqknernz", // Kicked Out Of The Sky
          method: "POST",
          dataType: "json",
          data: formData,
        })
          .done(function (data) {
            alert("Your email has been sent to kickedoutofthesky@gmail.com");
            $("#name").val("");
            $("#email").val("");
            $("#message").val("");
          })
          .fail(function (jqXHR, textStatus, errorThrown) {
            alert("There was an error sending your message. Please try again.");
            console.error("Form submission error:", textStatus, errorThrown);
          });
      });
